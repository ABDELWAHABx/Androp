name: Public androp builds

on:
  push:
    branches: [main]
    paths: ['mac/**', 'android/**', '.github/workflows/public-builds.yml', '.github/build-recipient.txt']
  workflow_dispatch:
    inputs:
      run_android:
        description: Also run Android build and tests
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: public-builds-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && !inputs.run_android && 'mac' || 'all' }}
  cancel-in-progress: false

env:
  RELEASE_TAG: androp-v0.1.0-preview.6

jobs:
  mac-build:
    if: github.repository == 'ABDELWAHABx/Androp' && github.event.repository.private == false && github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'
      - name: Build and verify on macOS
        run: bash mac/Tools/Release/build-mac.sh "$RELEASE_TAG" arm64
      - name: Verify the final package on macOS 26
        run: python3 mac/Tools/Release/verify-package.py mac/dist --tag "$RELEASE_TAG" --expected-source "$GITHUB_SHA" --runtime-major 26
      - name: Upload Mac installers
        uses: actions/upload-artifact@v4
        with:
          name: androp-mac
          path: |
            mac/dist/${{ env.RELEASE_TAG }}-arm64.zip
            mac/dist/${{ env.RELEASE_TAG }}-arm64.dmg
            mac/dist/${{ env.RELEASE_TAG }}-arm64-BUILD.json
            mac/dist/${{ env.RELEASE_TAG }}-arm64-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  macos15-policies:
    if: github.repository == 'ABDELWAHABx/Androp' && github.event.repository.private == false && github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: bash mac/Tests/run-mac-regressions.sh

  android:
    if: github.repository == 'ABDELWAHABx/Androp' && github.event.repository.private == false && github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || inputs.run_android)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true
      - name: Install SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Build and verify
        run: bash ./gradlew :app:assembleDebug :app:assembleRelease :app:testDebugUnitTest :app:lintDebug --no-daemon --console=plain --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process
      - name: Upload test reports only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            android/app/build/reports/lint-results-debug.xml
            android/app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: ignore
          retention-days: 1
