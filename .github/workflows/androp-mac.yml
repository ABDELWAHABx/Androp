name: Private androp macOS build

on:
  push:
    branches: [androp]
    paths: ['mac/**', '.github/workflows/androp-mac.yml']
  workflow_dispatch:
    inputs:
      source_ref:
        description: Source branch to build
        default: androp
        type: string
      tag:
        description: Private release tag (letters, digits, dots, underscores, hyphens)
        required: true
        type: string
      architecture:
        description: Mac architecture
        default: arm64
        type: choice
        options: [arm64, universal]
      publish_release:
        description: Upload downloads to a private GitHub prerelease
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: private-mac-release-${{ inputs.tag || 'androp-v0.1.0-preview.2' }}
  cancel-in-progress: false

jobs:
  sequoia-regressions:
    if: github.event.repository.private == true
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.sha }}
      - name: Run production lifecycle and parser regressions on macOS 15
        run: bash mac/Tests/run-mac-regressions.sh

  build:
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mac
    steps:
      - name: Require a private repository
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: .
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)" = true

      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.sha }}

      - name: Select Xcode 26 or newer
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build, test policy and package private downloads
        env:
          RELEASE_TAG: ${{ inputs.tag || 'androp-v0.1.0-preview.2' }}
          RELEASE_ARCHITECTURE: ${{ inputs.architecture || 'arm64' }}
        run: bash Tools/Release/build-mac.sh "$RELEASE_TAG" "$RELEASE_ARCHITECTURE"

      - name: Save build log
        if: always() && github.event.repository.private == true
        uses: actions/upload-artifact@v4
        with:
          name: mac-build-log-${{ github.run_id }}
          path: mac/dist/build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Save downloadable builds
        uses: actions/upload-artifact@v4
        with:
          name: androp-mac-${{ inputs.tag || 'androp-v0.1.0-preview.2' }}
          path: |
            mac/dist/*.zip
            mac/dist/*.dmg
            mac/dist/*-BUILD.json
            mac/dist/*-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  release:
    needs: [build, sequoia-regressions]
    if: inputs.publish_release == true || github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Require a private repository again before publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)" = true

      - uses: actions/download-artifact@v4
        with:
          name: androp-mac-${{ inputs.tag || 'androp-v0.1.0-preview.2' }}
          path: downloads

      - name: Publish private prerelease downloads
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || 'androp-v0.1.0-preview.2' }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,79}$ ]]
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)" = true
          cat > release-notes.md <<'EOF'
          Private androp macOS build. Download the ZIP or DMG and read INSTALL.txt.

          Ad-hoc signed; not Apple notarized. App macOS 14.5+, widget macOS 15+.
          Closed-lid mode is experimental, default off, and requires local opt-in
          on macOS 15. Driver acceptance does not verify physical lid behavior.
          Original license and attribution are included. See BUILD.json and hashes.
          EOF
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            release_commit=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq .object.sha)
            test "$release_commit" = "$GITHUB_SHA"
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "androp $RELEASE_TAG · macOS" \
              --notes-file release-notes.md --prerelease
          fi
          gh release upload "$RELEASE_TAG" downloads/* --repo "$GITHUB_REPOSITORY" --clobber
